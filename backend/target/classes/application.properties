# =============================================
# Quiniela Quevaber Mundial 2026 - Backend Config
# =============================================

# Server
server.port=8080

# Database - Configura tus datos de MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/quiniela_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD_MYSQL_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=QuiniielaQuevaber2026SecretKeyMundialMexico32bytesLong!
jwt.expiration=86400000

# CORS - Actualiza esto con tu URL de Render o ngrok cuando la tengas
app.cors.allowed-origins=http://localhost:5173,https://TU-FRONTEND.onrender.com

# Cierre de quiniela: 11 de junio 2026, 10:00 AM hora México (UTC-6 = 16:00 UTC)
app.quiniela.cierre=2026-06-11T16:00:00Z

# Zona horaria
spring.jackson.time-zone=America/Mexico_City
